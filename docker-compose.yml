name: ai-dream

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ai_dream_development}
      POSTGRES_USER: ${DATABASE_USER:-ai_dream}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$$OLLAMA_MODEL"
        wait "$$server_pid"
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -Fq \"$$OLLAMA_MODEL\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  voice:
    build:
      context: ./voice-service
      args:
        OPENVOICE_REF: ${OPENVOICE_REF:-main}
        MELOTTS_REF: ${MELOTTS_REF:-main}
    restart: unless-stopped
    environment:
      VOICE_DATA_DIR: /data
      VOICE_DEVICE: ${VOICE_DEVICE:-cpu}
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN:?Set VOICE_SERVICE_TOKEN in .env}
    volumes:
      - voice-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-ai_dream_development}
      DATABASE_USER: ${DATABASE_USER:-ai_dream}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/glm-5p3-flash}
      VOICE_SERVICE_URL: http://voice:8000
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN:?Set VOICE_SERVICE_TOKEN in .env}
      FORCE_SSL: ${FORCE_SSL:-false}
    volumes:
      - app-storage:/app/storage
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      voice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-storage:
  ollama-data:
  postgres-data:
  voice-data:
