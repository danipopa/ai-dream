apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-dream-app-storage
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.100.1
    path: /home/storage/ai-dreams/app
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-dream-voice-data
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.100.1
    path: /home/storage/ai-dreams/voice
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-dream-postgres-data
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.100.1
    path: /home/storage/ai-dreams/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage
spec:
  volumeName: ai-dream-app-storage
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  volumeName: ai-dream-postgres-data
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-data
spec:
  volumeName: ai-dream-voice-data
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
---
