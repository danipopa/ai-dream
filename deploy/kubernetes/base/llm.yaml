apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
data:
  LLM_PROVIDER: ollama
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: qwen2.5:3b
  FIREWORKS_MODEL: accounts/fireworks/models/glm-5p3-flash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: ollama
        image: 192.168.100.16:30501/ai-dream-ollama:release
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODEL
          valueFrom:
            configMapKeyRef:
              name: ollama-config
              key: OLLAMA_MODEL
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        resources:
          requests:
            cpu: '4'
            memory: 6Gi
          limits:
            cpu: '8'
            memory: 10Gi
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "OLLAMA_HOST=127.0.0.1:11434 ollama list | grep -Fq \"$OLLAMA_MODEL\""]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "OLLAMA_HOST=127.0.0.1:11434 ollama list | grep -Fq \"$OLLAMA_MODEL\""]
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: http
