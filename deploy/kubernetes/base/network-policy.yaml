apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-private
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 3000
---
